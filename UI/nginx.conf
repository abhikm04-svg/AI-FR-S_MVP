server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback -- React Router uses browser history mode, so any
    # non-file route (/analysis/:id, /results/:id, /history) must resolve
    # to index.html and let the client-side router take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
